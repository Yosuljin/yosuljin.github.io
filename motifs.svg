<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Yosuljin, direction RÉMANENCE: the motif sprite. Every symbol is drawn in currentColor (set the CSS color of
       the use element or of its svg), with its own internal opacities; strokes keep their width at any size
       (non-scaling). No gradient, mask, filter or nested use: the symbols render the same inlined, referenced from
       this file (use href="motifs.svg#sakura-petal-fill"), as a CSS mask, or rasterised for WebGL through Path2D.
       Decorative only: put aria-hidden="true" on the svg that uses them. -->
  <!-- Cherry petal, solid: obovate, widest at 60 % of its length from the base, a narrow V notch at the apex, a short claw.
       Masks, the falling petal, the WebGL petal textures (Path2D of this exact d). -->
  <symbol id="sakura-petal-fill" viewBox="0 0 60 80"><path d="M27.86 76.05C21.45 65.6 8.62 50.4 7.9 31.4C7.48 18.1 15.74 6.32 26.58 5.56L30 11.26L33.42 5.56C44.26 6.32 52.52 18.1 52.1 31.4C51.38 50.4 38.55 65.6 32.14 76.05C30.86 77.57 29.14 77.57 27.86 76.05Z" fill="currentColor"/></symbol>

  <!-- Left wing (mirror of the right), hinge on the right edge of this box: its own HTML svg, transform-origin 100% 50%, rotateY. -->
  <symbol id="butterfly-wing-l" viewBox="0 0 60 100"><path d="M58.5 41C52 31.5 38 20.5 21 14.5C12.5 11.5 5.5 13.5 6.5 19.5C7.5 26.5 16 38 27.5 46.5C35.5 52 47.5 53 58 49.5ZM58 51.5C48 50.5 34.5 53.5 28 60C22.5 65.5 23.5 74.5 30.5 79C32.5 84 33.5 90 36 95.5C38.5 90.5 39.8 85.5 40.4 81.5C48 80.5 55 69.5 58 57.5Z" fill="currentColor" fill-opacity=".13"/><path d="M58.5 41C52 31.5 38 20.5 21 14.5C12.5 11.5 5.5 13.5 6.5 19.5C7.5 26.5 16 38 27.5 46.5C35.5 52 47.5 53 58 49.5ZM58 51.5C48 50.5 34.5 53.5 28 60C22.5 65.5 23.5 74.5 30.5 79C32.5 84 33.5 90 36 95.5C38.5 90.5 39.8 85.5 40.4 81.5C48 80.5 55 69.5 58 57.5Z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M57 44.5C44 35 29 24.5 12 18M56.5 46.5C44 43 30 40 16.5 33.5M56 48.5C46 48 35 47.5 26 45M56 54C47 56 37 60 29.5 64.5M56 56.5C50 63.5 44 71.5 36.5 79" fill="none" stroke="currentColor" stroke-opacity=".42" stroke-width=".6" stroke-linecap="round" vector-effect="non-scaling-stroke"/><g fill="currentColor" fill-opacity=".75"><circle cx="14" cy="25.5" r="1.1"/><circle cx="19.5" cy="32.5" r="0.95"/><circle cx="25.5" cy="39" r="0.85"/></g><circle cx="33.5" cy="69.5" r="2.9" fill="none" stroke="currentColor" stroke-opacity=".8" stroke-width=".8" vector-effect="non-scaling-stroke"/><circle cx="33.5" cy="69.5" r="1.05" fill="currentColor"/></symbol>

  <!-- Right wing, hinge on the left edge of this box: its own HTML svg (viewBox 0 0 60 100), transform-origin 0 50%, rotateY. -->
  <symbol id="butterfly-wing-r" viewBox="60 0 60 100"><path d="M61.5 41C68 31.5 82 20.5 99 14.5C107.5 11.5 114.5 13.5 113.5 19.5C112.5 26.5 104 38 92.5 46.5C84.5 52 72.5 53 62 49.5ZM62 51.5C72 50.5 85.5 53.5 92 60C97.5 65.5 96.5 74.5 89.5 79C87.5 84 86.5 90 84 95.5C81.5 90.5 80.2 85.5 79.6 81.5C72 80.5 65 69.5 62 57.5Z" fill="currentColor" fill-opacity=".13"/><path d="M61.5 41C68 31.5 82 20.5 99 14.5C107.5 11.5 114.5 13.5 113.5 19.5C112.5 26.5 104 38 92.5 46.5C84.5 52 72.5 53 62 49.5ZM62 51.5C72 50.5 85.5 53.5 92 60C97.5 65.5 96.5 74.5 89.5 79C87.5 84 86.5 90 84 95.5C81.5 90.5 80.2 85.5 79.6 81.5C72 80.5 65 69.5 62 57.5Z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M63 44.5C76 35 91 24.5 108 18M63.5 46.5C76 43 90 40 103.5 33.5M64 48.5C74 48 85 47.5 94 45M64 54C73 56 83 60 90.5 64.5M64 56.5C70 63.5 76 71.5 83.5 79" fill="none" stroke="currentColor" stroke-opacity=".42" stroke-width=".6" stroke-linecap="round" vector-effect="non-scaling-stroke"/><g fill="currentColor" fill-opacity=".75"><circle cx="106" cy="25.5" r="1.1"/><circle cx="100.5" cy="32.5" r="0.95"/><circle cx="94.5" cy="39" r="0.85"/></g><circle cx="86.5" cy="69.5" r="2.9" fill="none" stroke="currentColor" stroke-opacity=".8" stroke-width=".8" vector-effect="non-scaling-stroke"/><circle cx="86.5" cy="69.5" r="1.05" fill="currentColor"/></symbol>

  <!-- Body, head and clubbed antennae (a butterfly, not a moth), on the full 120 x 100 box so it overlays both wings. -->
  <symbol id="butterfly-body" viewBox="0 0 120 100"><path d="M59.2 34C57.2 27 54 20.5 49.5 15.5M60.8 34C62.8 27 66 20.5 70.5 15.5" fill="none" stroke="currentColor" stroke-width=".8" stroke-linecap="round" vector-effect="non-scaling-stroke"/><circle cx="49.3" cy="15.2" r="1.35" fill="currentColor"/><circle cx="70.7" cy="15.2" r="1.35" fill="currentColor"/><circle cx="60" cy="36" r="2.3" fill="currentColor" fill-opacity=".85"/><path d="M60 38.6C62.3 38.6 62.9 44 62.5 48.4C62.2 50.9 61.3 51.9 60 51.9C58.7 51.9 57.8 50.9 57.5 48.4C57.1 44 57.7 38.6 60 38.6Z" fill="currentColor" fill-opacity=".85"/><path d="M60 52.4C61.8 55.8 61.9 68 60 80C58.1 68 58.2 55.8 60 52.4Z" fill="currentColor" fill-opacity=".7"/></symbol>

  <!-- Colour burst: the start of an analogue video line (porch, sync tip, nine cycles of burst). Head of every section divider, in the page tint; the rest of the line is CSS. -->
  <symbol id="salve" viewBox="0 0 48 12"><path d="M0 6H10V9.5H17V6H20" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="1" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M20 6q.5 -4.8 1 0q.5 4.8 1 0q.5 -4.8 1 0q.5 4.8 1 0q.5 -4.8 1 0q.5 4.8 1 0q.5 -4.8 1 0q.5 4.8 1 0q.5 -4.8 1 0q.5 4.8 1 0q.5 -4.8 1 0q.5 4.8 1 0q.5 -4.8 1 0q.5 4.8 1 0q.5 -4.8 1 0q.5 4.8 1 0q.5 -4.8 1 0q.5 4.8 1 0" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M38 6H48" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="1" vector-effect="non-scaling-stroke"/></symbol>

  <!-- A project of the owner on a map: a lit core in its ring. -->
  <symbol id="node-projet" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width=".9" vector-effect="non-scaling-stroke"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></symbol>

  <!-- Arrows drawn, because the site's font subsets have no arrow glyphs. -->
  <symbol id="arrow-ne" viewBox="0 0 16 16"><path d="M4.5 11.5L11.5 4.5M6 4.5H11.5V10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></symbol>

  <!-- East. -->
  <symbol id="arrow-e" viewBox="0 0 16 16"><path d="M2.5 8H13.5M9.5 4L13.5 8L9.5 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></symbol>

  <!-- West (back). -->
  <symbol id="arrow-w" viewBox="0 0 16 16"><path d="M13.5 8H2.5M6.5 4L2.5 8L6.5 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></symbol>

  <!-- South. -->
  <symbol id="arrow-s" viewBox="0 0 16 16"><path d="M8 2.5V13.5M4 9.5L8 13.5L12 9.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></symbol>

</svg>
